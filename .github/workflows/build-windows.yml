name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Compilar EXE con PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onefile `
            --name FreeMatAIStudio `
            --paths app `
            --paths app/mengine `
            --add-data "app/mengine;mengine" `
            app/main.py

      - name: Subir EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FreeMatAIStudio-windows
          path: dist/FreeMatAIStudio.exe
